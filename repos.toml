# The 10 study repos plus alternates. Fill in `install` and `test_cmd` while you
# set each one up, and pin `sha` once its image builds and validation passes.
#
# test_cmd placeholders: {tests} = space-separated test files, {junit} = report path.
# Globs support **. A file counts as a test if it matches test_globs, as source
# if it matches src_globs and not exclude_globs.

[defaults]
python = "3.12"
since = "2025-10-01"          # mine merged changes on the default branch from this date
max_src_files = 4             # keep tasks small enough to judge
max_changed_lines = 400
test_globs = ["**/tests/**", "**/test_*.py", "**/*_test.py", "**/conftest.py"]
src_globs = ["**/*.py"]
exclude_globs = ["doc/**", "docs/**", "examples/**", "benchmarks/**", ".github/**"]
test_cmd = "python -m pytest -q -p no:cacheprovider --junitxml={junit} {tests}"
pythonpath = ""               # extra PYTHONPATH for the local executor, e.g. "src"

