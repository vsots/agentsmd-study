[project]
name = "ctxstudy"
version = "0.1.0"
description = "An open study of whether AGENTS.md and CLAUDE.md files change what coding agents cost, how fast they finish, and whether they succeed."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# The harness itself uses only the standard library, so it installs anywhere.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ctxstudy = "ctxstudy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ctxstudy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
